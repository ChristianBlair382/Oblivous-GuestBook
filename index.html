<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traveler's Tavern</title>
    <link href="style.css" rel="stylesheet" type="text/css" media="all">
    <script src="image-font.js" defer></script>
    <script src="site-footer.js" defer></script>
  </head>
  <body class="guestbook-page-background">
    <div>
      <h1>
        <span 
            data-image-font 
            data-image-font-kern="-4" 
            data-image-font-space-width="16" 
            style="display: inline-flex; gap: 0; transform: scale(2.8); transform-origin: center;"
          >Bulletin Board
        </span>
      </h1>
    </div>
      
    <div class="guestbook-container">
      <h2>
        <span 
          data-image-font
          data-image-font-kern="-4" 
          data-image-font-space-width="16" 
          style="display: inline-flex; gap: 0; transform: scale(1.6); transform-origin: center;"
        >Sign here!
        </span>
      </h2>
      <div class="guestbook-form">
        <div class="form-group">
          <label for="name">Name:</label>
          <input type="text" id="name" value="Anonymous">
        </div>

        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" placeholder="your@email.com">
          <small>Optional, will be only visible to guestbook owner</small>
        </div>

        <div class="form-group">
          <label for="message-color">Container Color:</label>
          <div class="color-picker">
            <label><input type="radio" name="message-color" value="white" checked> ⚪ White</label>
            <label><input type="radio" name="message-color" value="red" checked> 🔴 Red</label>
            <label><input type="radio" name="message-color" value="orange"> 🟠 Orange</label>
            <label><input type="radio" name="message-color" value="yellow"> 🟡 Yellow</label>
            <label><input type="radio" name="message-color" value="green"> 🟢 Green</label>
            <label><input type="radio" name="message-color" value="cyan"> 🔵 Cyan</label>
            <label><input type="radio" name="message-color" value="blue"> 💙 Blue</label>
            <label><input type="radio" name="message-color" value="violet"> 💜 Violet</label>
          </div>
        </div>

        <div class="form-group">
          <label for="message">Message:</label>
          <div class="formatting-toolbar">
            <button type="button" onclick="wrapText('**', '**')"><strong>B</strong></button>
            <button type="button" class="italic" onclick="wrapText('_', '_')">I</button>
            <button type="button" class="underline" onclick="wrapText('<u>', '</u>')">U</button>
            <button type="button" onclick="insertEmoji('😊')">😊</button>
            <button type="button" onclick="insertEmoji('❤️')">❤️</button>
            <button type="button" onclick="insertEmoji('✨')">✨</button>
            <button type="button" onclick="insertEmoji('👍')">👍</button>
          </div>
          <textarea id="message" placeholder="Let this world know that you exist..."></textarea>
        </div>

        <button id="send-btn" onclick="submitMessage()">Send</button>
      </div>

      <h3>
          <span 
            data-image-font 
            data-image-font-kern="-4" 
            data-image-font-space-width="16" 
            style="display: inline-flex; gap: 0; transform: scale(4.8); transform-origin: center;"
            >Messages
          </span>
        </h3>
      <div class="text-item">
        <div class="page-info">
          <span id="message-count">Page 1 of 1 (0 messages)</span>
        </div>
      </div>
      <!-- User messages appear here. -->
      <div id="messages-container"></div>
    </div>
    

    <script>
      const STORAGE_KEY = 'guestbook_messages';

      // Load messages from backend, fallback to localStorage
      async function loadMessages() {
        try {
          // Try to fetch from backend first
          const response = await fetch('https://neocities-guestbook-backend-production-04c9.up.railway.app/messages');
          if (response.ok) {
            const data = await response.json();
            const backendMessages = data.messages || [];
            
            // Save to localStorage as cache
            saveMessages(backendMessages);
            
            // Display messages
            displayMessages(backendMessages);
            return;
          }
        } catch (error) {
          console.log('Could not fetch from backend, using local storage:', error);
        }
        
        // Fallback to local storage
        const messages = getMessages();
        displayMessages(messages);
      }

      function displayMessages(messages) {
        const container = document.getElementById('messages-container');
      
        if (messages.length === 0) {
          container.innerHTML = '<div class="no-messages">No one is here yet...</div>';
          document.getElementById('message-count').textContent = 'Page 1 of 1 (0 messages)';
          return;
        }
      
        // Display messages in reverse order (newest first)
        const reversedMessages = [...messages].reverse();
        container.innerHTML = reversedMessages.map((msg, index) => `
          <div class="message-item message-color-${msg.color || 'red'}">
            <div class="message-header">
              <span class="message-author">${escapeHtml(msg.name)}</span>
            </div>
            <span class="message-timestamp">${formatDate(msg.timestamp)}</span>
            <div class="message-body">${escapeHtml(msg.message)}</div>
            <button class="message-delete-btn" onclick="deleteMessage(${messages.length - 1 - index})">Delete</button>
          </div>
        `).join('');
      
        document.getElementById('message-count').textContent = `Page 1 of 1 (${messages.length} message${messages.length !== 1 ? 's' : ''})`;
      }

      function getMessages() {
        const stored = localStorage.getItem(STORAGE_KEY);
        return stored ? JSON.parse(stored) : [];
      }

      function saveMessages(messages) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
      }

      async function submitMessage() {
        const name = document.getElementById('name').value.trim() || 'Anonymous';
        const email = document.getElementById('email').value.trim();
        const message = document.getElementById('message').value.trim();
        const color = document.querySelector('input[name="message-color"]:checked').value;

        if (!message) {
          alert('Oi! You\'re supposed to write something!');
          return;
        }

        const sendBtn = document.getElementById('send-btn');
        const originalText = sendBtn.textContent;
        sendBtn.disabled = true;
        sendBtn.textContent = 'Sending...';

        try {
          const response = await fetch('https://neocities-guestbook-backend-production-04c9.up.railway.app/submit-guestbook', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              name: name,
              email: email,
              message: message,
              color: color
            })
          });

          if (!response.ok) {
            throw new Error(`Server error: ${response.status}`);
          }

          const result = await response.json();

          // Store locally for quick display
          const newMessage = {
            name: name,
            email: email,
            message: message,
            color: color,
            timestamp: new Date().toISOString()
          };

          const messages = getMessages();
          messages.push(newMessage);
          saveMessages(messages);

          // Clear the form
          document.getElementById('message').value = '';
          document.getElementById('email').value = '';
          document.getElementById('name').value = 'Anonymous';

          // Reload messages
          loadMessages();
          
          alert('Thank you for confirming that you existed here!');
        } catch (error) {
          console.error('Error submitting message:', error);
          alert('Error submitting message. Please try again.');
        } finally {
          sendBtn.disabled = false;
          sendBtn.textContent = originalText;
        }
      }

      function deleteMessage(index) {
        if (confirm('Are you sure you want to delete this message?')) {
          const messages = getMessages();
          messages.splice(index, 1);
          saveMessages(messages);
          loadMessages();
        }
      }

      function wrapText(before, after) {
        const textarea = document.getElementById('message');
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        const text = textarea.value;
        const selectedText = text.substring(start, end);

        if (!selectedText) return;

        const newText = text.substring(0, start) + before + selectedText + after + text.substring(end);
        textarea.value = newText;
      }

      function insertEmoji(emoji) {
        const textarea = document.getElementById('message');
        const start = textarea.selectionStart;
        const text = textarea.value;
        textarea.value = text.substring(0, start) + emoji + text.substring(start);
        textarea.focus();
        textarea.selectionStart = textarea.selectionEnd = start + emoji.length;
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      function formatDate(isoString) {
        const date = new Date(isoString);
        const month = date.toLocaleString('en-US', { month: 'short' });
        const day = date.getDate();
        const year = date.getFullYear();
        const time = date.toLocaleString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
        return `${month} ${day}, ${year} at ${time}`;
      }

      // Load messages when page loads
      loadMessages();
    </script>
  </body>
</html>
