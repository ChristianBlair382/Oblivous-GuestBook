    <script>
      const STORAGE_KEY = 'guestbook_messages';

      // Load messages on page load
      function loadMessages() {
        const messages = getMessages();
        const container = document.getElementById('messages-container');

        if (messages.length === 0) {
          container.innerHTML = '<div class="no-messages">No one is here yet...</div>';
          document.getElementById('message-count').textContent = 'Page 1 of 1 (0 messages)';
          return;
        }

        // Display messages in reverse order (newest first)
        const reversedMessages = [...messages].reverse();
        container.innerHTML = reversedMessages.map((msg, index) => `
          <div class="message-item message-color-${msg.color || 'red'}">
            <div class="message-header">
              <span class="message-author">${escapeHtml(msg.name)}</span>
            </div>
            <span class="message-timestamp">${formatDate(msg.timestamp)}</span>
            <div class="message-body">${escapeHtml(msg.message)}</div>
            <button class="message-delete-btn" onclick="deleteMessage(${messages.length - 1 - index})">Delete</button>
          </div>
        `).join('');

        document.getElementById('message-count').textContent = `Page 1 of 1 (${messages.length} message${messages.length !== 1 ? 's' : ''})`;
      }

      function getMessages() {
        const stored = localStorage.getItem(STORAGE_KEY);
        return stored ? JSON.parse(stored) : [];
      }

      function saveMessages(messages) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
      }

      async function submitMessage() {
        const name = document.getElementById('name').value.trim() || 'Anonymous';
        const email = document.getElementById('email').value.trim();
        const message = document.getElementById('message').value.trim();
        const color = document.querySelector('input[name="message-color"]:checked').value;

        if (!message) {
          alert('Oi! You\'re supposed to write something!');
          return;
        }

        const sendBtn = document.getElementById('send-btn');
        const originalText = sendBtn.textContent;
        sendBtn.disabled = true;
        sendBtn.textContent = 'Sending...';

        try {
          const response = await fetch('https://neocities-guestbook-backend-production-04c9.up.railway.app/submit-guestbook', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              name: name,
              email: email,
              message: message,
              color: color
            })
          });

          if (!response.ok) {
            throw new Error(`Server error: ${response.status}`);
          }

          const result = await response.json();

          // Store locally for quick display
          const newMessage = {
            name: name,
            email: email,
            message: message,
            color: color,
            timestamp: new Date().toISOString()
          };

          const messages = getMessages();
          messages.push(newMessage);
          saveMessages(messages);

          // Clear the form
          document.getElementById('message').value = '';
          document.getElementById('email').value = '';
          document.getElementById('name').value = 'Anonymous';

          // Reload messages
          loadMessages();
          
          alert('Thank you for confirming that you existed here!');
        } catch (error) {
          console.error('Error submitting message:', error);
          alert('Error submitting message. Please try again.');
        } finally {
          sendBtn.disabled = false;
          sendBtn.textContent = originalText;
        }
      }

      function deleteMessage(index) {
        if (confirm('Are you sure you want to delete this message?')) {
          const messages = getMessages();
          messages.splice(index, 1);
          saveMessages(messages);
          loadMessages();
        }
      }

      function wrapText(before, after) {
        const textarea = document.getElementById('message');
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        const text = textarea.value;
        const selectedText = text.substring(start, end);

        if (!selectedText) return;

        const newText = text.substring(0, start) + before + selectedText + after + text.substring(end);
        textarea.value = newText;
      }

      function insertEmoji(emoji) {
        const textarea = document.getElementById('message');
        const start = textarea.selectionStart;
        const text = textarea.value;
        textarea.value = text.substring(0, start) + emoji + text.substring(start);
        textarea.focus();
        textarea.selectionStart = textarea.selectionEnd = start + emoji.length;
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      function formatDate(isoString) {
        const date = new Date(isoString);
        const month = date.toLocaleString('en-US', { month: 'short' });
        const day = date.getDate();
        const year = date.getFullYear();
        const time = date.toLocaleString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
        return `${month} ${day}, ${year} at ${time}`;
      }

      // Load messages when page loads
      loadMessages();
    </script>
  </body>
</html>
